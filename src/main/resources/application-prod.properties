# OAuth2 Client Configurations
# Google Configure
spring.security.oauth2.client.registration.google.client-name=${GOOGLE_NAME}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email, profile


# Github Configuration
spring.security.oauth2.client.registration.github.client-name=${GITHUB_NAME}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=email, profile

# Cloudinary Configurations
cloudinary.cloud.name=${CLOUDINARY_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# Email Configurations
# spring.mail.host=live.smtp.mailtrap.io
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
# spring.mail.username=api
spring.mail.username=${EMAIL_USERNAME}
# spring.mail.password=651fbf67b9801735b38ebdffa242868e

spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# spring.mail.properties.domain_name=scm@demomailtrap.com

spring.mail.properties.domain_name=${EMAIL_DOMAIN}

